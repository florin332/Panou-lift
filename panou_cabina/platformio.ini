[env:marble]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = groundstudio_marble_pico
framework = arduino

board_build.core = earlephilhower
board_build.f_cpu = 133000000L
board_build.usb_mode = pico_sdk

monitor_speed = 115200

build_flags =
  -Wall
  -Wextra
  -std=gnu++17
  -I src/Core/Models
  -I src/Core/Services
  -I src/Presentation
  -I src/Drivers
  -I Fonts

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit ILI9341 @ ^1.6.4
  earlephilhower/ESP8266Audio@^2.4.1

upload_port = auto
upload_protocol = picotool
;upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\upload_pico.ps1 -FirmwarePath "$BUILD_DIR\firmware.uf2" -UploadPort "$UPLOAD_PORT"